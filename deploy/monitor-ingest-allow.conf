# /etc/nginx/monitor-ingest-allow.conf
# Which public IPs may POST data to /api/ingest. Everyone else gets 403 before reaching the app.
#
# Find each site's public IP by running this ON THE SITE'S RELAY SERVER:
#     (Invoke-RestMethod https://api.ipify.org)
# Then replace the "allow all;" line below with one line per site, e.g.:
#
#     allow 203.0.113.10;     # Eastwood Primary
#     allow 198.51.100.25;    # Southend YMCA
#     deny  all;
#
# After editing:  sudo nginx -t && sudo systemctl reload nginx
# If a site's IP changes, its relay will log HTTP 403 until you add the new one.

allow all;      # <-- TEMPORARY: replace with the site IPs + "deny all;" once you know them
