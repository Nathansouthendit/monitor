# /etc/ssh/sshd_config.d/10-hardening.conf
#
# !! Only install this AFTER you've confirmed you can log in with your SSH key !!
#    (from Windows:  ssh-keygen -t ed25519   then copy ~/.ssh/id_ed25519.pub into
#     ~/.ssh/authorized_keys on the VPS, and test  ssh youruser@server  works with no password)
#
# Install:  sudo cp sshd-hardening.conf /etc/ssh/sshd_config.d/10-hardening.conf
#           sudo sshd -t && sudo systemctl reload ssh
# Keep your current SSH window open and test a NEW login before closing it.
# If locked out, use the Fasthosts control panel's web console to undo it.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
