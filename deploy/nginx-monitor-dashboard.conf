# /etc/nginx/sites-available/monitor-dashboard
#
# 1. Replace dashboard.example.com with your real hostname (2 places).
# 2. sudo ln -s /etc/nginx/sites-available/monitor-dashboard /etc/nginx/sites-enabled/
# 3. sudo nginx -t && sudo systemctl reload nginx
# 4. sudo certbot --nginx -d dashboard.example.com --redirect     (adds HTTPS + auto-renew)
#
# Real visitor IPs behind Cloudflare come from /etc/nginx/conf.d/cloudflare-realip.conf,
# written by cloudflare-lockdown.sh. Without it, every visitor looks like a Cloudflare IP and
# the app's per-IP lockouts and these rate limits would hit everyone at once.

# Rate limits per visitor IP (these lines must be outside the server block)
limit_req_zone $binary_remote_addr zone=mon_login:10m  rate=10r/m;    # sign-in attempts
limit_req_zone $binary_remote_addr zone=mon_ingest:10m rate=120r/m;   # relay posts
limit_req_zone $binary_remote_addr zone=mon_pages:10m  rate=120r/m;   # everything else
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.example.com;

    server_tokens off;
    client_max_body_size 10m;          # matches MAX_CONTENT_LENGTH in app.py
    client_body_timeout 30s;
    client_header_timeout 15s;

    # Keep the dashboard out of search engines
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Shared proxy settings
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;    # real IP (after real_ip), not appended
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 60s;

    # Sign-in and 2FA pages: slow down password / code guessing
    location ~ ^/login(/2fa)?$ {
        limit_req zone=mon_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }

    # Relay ingest: only the client sites' public IPs (edit the file it includes).
    # Push-Dashboard.ps1 sends up to 50 files back to back, hence the burst of 60.
    location = /api/ingest {
        limit_req zone=mon_ingest burst=60 nodelay;
        include /etc/nginx/monitor-ingest-allow.conf;
        proxy_pass http://127.0.0.1:8001;
    }

    location / {
        limit_req zone=mon_pages burst=40 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }
}
